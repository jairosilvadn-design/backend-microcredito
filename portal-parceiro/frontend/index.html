<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal do Parceiro — Crédito Imobiliário</title>
  <style>
    body{font:16px system-ui;margin:0;background:#f4f5f7;color:#1b1f24}
    main{max-width:560px;margin:0 auto;padding:16px}
    section{background:#fff;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 1px 3px #0002}
    label{display:block;margin:10px 0 4px;font-size:14px}
    input,select,button{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px}
    button{background:#ec7000;color:#fff;border:0;margin-top:16px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .hidden{display:none}.erro{color:#b00020}.ok{color:#0a7d33}
    .badge{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:600}
    .APROVADO{background:#d9f5e3}.RECUSADO{background:#fde0e0}.EM_ANALISE{background:#fff3cd}
  </style>
</head>
<body><main>
  <h1>Portal do Parceiro</h1>

  <section id="tela-login">
    <h2 id="titulo-auth">Entrar</h2>
    <form id="form-auth">
      <div id="campos-cadastro" class="hidden">
        <label>Nome da imobiliária <input id="nome"></label>
        <label>CNPJ <input id="cnpj" inputmode="numeric"></label>
      </div>
      <label>E-mail <input id="email" type="email" required></label>
      <label>Senha <input id="senha" type="password" minlength="8" required></label>
      <button>Continuar</button>
      <p><a href="#" id="alternar">Quero me cadastrar</a></p>
      <p id="msg-auth" class="erro"></p>
    </form>
  </section>

  <section id="tela-pendente" class="hidden">
    <h2>Cadastro em análise</h2>
    <p>Seu acesso será liberado após a aprovação do administrador.</p>
    <button id="sair1">Sair</button>
  </section>

  <section id="tela-simulacao" class="hidden">
    <h2>Nova simulação</h2>
    <form id="form-sim">
      <label>CPF <input id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></label>
      <label>Data de nascimento <input id="nasc" type="date" required></label>
      <label>Renda bruta mensal (R$) <input id="renda" data-moeda inputmode="numeric" placeholder="R$ 0,00" autocomplete="off" required></label>
      <label>Usará FGTS?
        <select id="fgts"><option value="nao">Não</option><option value="sim">Sim</option></select></label>
      <label id="fgts-valor-l" class="hidden">Valor do FGTS (R$) <input id="fgtsValor" data-moeda inputmode="numeric" placeholder="R$ 0,00" autocomplete="off"></label>
      <label>Valor do imóvel (R$) <input id="imovel" data-moeda inputmode="numeric" placeholder="R$ 0,00" autocomplete="off" required></label>
      <label>Valor do financiamento (R$) <input id="financ" data-moeda inputmode="numeric" placeholder="R$ 0,00" autocomplete="off" required></label>
      <label>Sistema de amortização
        <select id="sistema"><option>SAC</option><option>PRICE</option></select></label>
      <button id="enviar">Enviar para Análise de Crédito</button>
      <p id="msg-sim" class="erro"></p>
    </form>
    <p><a href="#" id="sair2">Sair</a></p>
  </section>

  <section id="tela-resultado" class="hidden" aria-live="polite">
    <h2>Resultado</h2>
    <div id="resultado"></div>
    <button id="nova">Nova simulação</button>
  </section>
</main>
<script type="module" src="app.js"></script>
</body></html>
