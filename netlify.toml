[build]
  command = "npx prisma generate && node scripts/prepare-db.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma/client"]
  # Só o necessário no runtime do Netlify (AWS Lambda, limite de ~50 MB zipado):
  # motor do Prisma para rhel (sem o de debian, sem wasm, sem tipos) e nada da CLI do Prisma.
  included_files = [
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node",
    "!node_modules/.prisma/client/*.wasm",
    "!node_modules/.prisma/client/*.d.ts",
    "!node_modules/.prisma/client/**/*.d.ts",
    "!node_modules/@prisma/client/runtime/*.wasm",
    "!node_modules/@prisma/client/runtime/*.d.ts",
    "!node_modules/@prisma/client/runtime/*.d.mts",
    "prisma/schema.prisma"
  ]

# Toda rota vai para a API; /health, /api/*, /p/* (assinatura), /oauth/* e webhooks.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true
