[build]
  command = "npx prisma generate && node scripts/build-functions.mjs && node scripts/prepare-db.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  # O build precisa do Prisma CLI e do esbuild (devDependencies), mesmo se NODE_ENV=production estiver definido.
  NPM_FLAGS = "--include=dev"

[functions]
  directory = "netlify/functions"
  external_node_modules = ["@prisma/client", ".prisma/client"]
  # Só o necessário no runtime do Netlify (AWS Lambda, limite de ~50 MB zipado):
  # motor do Prisma para rhel (sem o de debian, sem wasm, sem tipos) e nada da CLI do Prisma.
  included_files = [
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node",
    "!node_modules/.prisma/client/*.wasm",
    "!node_modules/.prisma/client/*.d.ts",
    "!node_modules/.prisma/client/**/*.d.ts",
    "!node_modules/@prisma/client/runtime/*.wasm",
    "!node_modules/@prisma/client/runtime/*.d.ts",
    "!node_modules/@prisma/client/runtime/*.d.mts",
    "prisma/schema.prisma"
  ]

# Rotas da API (a função também declara os mesmos caminhos; aqui garante mesmo se a leitura do arquivo gerado falhar)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200
  force = true
